<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Recoil Run</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app"></div>
    <div id="vignette"></div>

    <div id="hud">
      <div id="best">BEST: 0m</div>
      <div id="dist">0m</div>
    </div>
    <div id="ammo"><span class="bullet"></span><span id="ammo-n">5</span></div>
    <div id="popups"></div>

    <div id="start" class="overlay">
      <div class="title">RECOIL RUN</div>
      <div class="hint">Tocá (o barra espaciadora) para disparar</div>
      <div class="sub">Disparás para adelante → vas para atrás.<br />Disparás para atrás → vas para adelante.<br />Headshot +3 · Kill +2</div>
    </div>

    <div id="over" class="overlay hidden">
      <div class="title">SIN BALAS</div>
      <div class="big" id="over-dist">0m</div>
      <div class="sub" id="over-best"></div>
      <button id="retry">OTRA VEZ</button>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
